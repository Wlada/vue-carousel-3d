name: CI

on:
  push:
    branches:
      - master
      - maintenance/vue2
      - next/vue3
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20.19.0'
          - '22'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Verify package exports
        run: pnpm smoke:exports

      - name: Inspect package contents
        if: matrix.node == '22'
        run: pnpm pack:check

  browser:
    name: Chromium smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:browser

  vue-compatibility:
    name: Vue ${{ matrix.vue }} package smoke test
    runs-on: ubuntu-latest
    # Vue 2 is maintained on maintenance/vue2 only; the Vue 3 line
    # (master, next/vue3) publishes with a `vue ^3.5.0` peer dependency,
    # so the Vue 2 smoke test applies to the maintenance branch and PRs
    # targeting it.
    if: github.ref == 'refs/heads/maintenance/vue2' || github.base_ref == 'maintenance/vue2'
    strategy:
      fail-fast: false
      matrix:
        vue:
          - '2.6.14'
          - '2.7.16'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack library
        run: pnpm pack --pack-destination artifacts

      - name: Create isolated consumer
        run: |
          mkdir vue-consumer
          cp tests/compat/vue2-consumer.cjs vue-consumer/smoke.cjs
          cd vue-consumer
          npm init -y
          npm install --ignore-scripts ../artifacts/*.tgz vue@${{ matrix.vue }} vue-server-renderer@${{ matrix.vue }}
          node smoke.cjs
